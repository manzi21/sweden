<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sverige TV — Premium IPTV Sverige">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="0.5" stop-color="#060407"/>
      <stop offset="1" stop-color="#1a0410"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c98a"/>
      <stop offset="1" stop-color="#a08350"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c1326" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7c1326" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="600" cy="315" rx="500" ry="280" fill="url(#glow)"/>

  <!-- Logo on left -->
  <g transform="translate(140 240)">
    <path d="M 0 -100 L 80 -75 L 80 30 Q 80 80 40 110 L 0 130 L -40 110 Q -80 80 -80 30 L -80 -75 Z"
          fill="#7c1326" stroke="url(#gold)" stroke-width="3"/>
    <text x="0" y="40" text-anchor="middle"
          font-family="Georgia, serif" font-size="100" font-weight="900"
          fill="url(#gold)">S</text>
  </g>

  <!-- Right side: title and tagline -->
  <text x="320" y="200"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="68" font-weight="900" fill="#fff"
        letter-spacing="-1">
    Sverige TV
  </text>
  <text x="320" y="280"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="42" font-weight="700" fill="url(#gold)">
    Premium IPTV Sverige
  </text>
  <text x="320" y="340"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="28" font-weight="500" fill="#c8c8d4">
    20 000+ kanaler · 4K · Sport · Film · 83 kr/mån
  </text>

  <!-- CTA bar at bottom -->
  <rect x="320" y="400" width="280" height="64" rx="10" fill="#22c55e"/>
  <text x="460" y="442" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="800" fill="#000">
    💬 WhatsApp · Essai 24h
  </text>

  <!-- Bottom rating -->
  <text x="320" y="520"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="22" font-weight="600" fill="#c8a96e">
    ★★★★★ 4.9/5 — 1 200+ clients
  </text>

  <!-- URL -->
  <text x="600" y="595" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="20" font-weight="600" fill="#7a7a86">
    premiumiptv.se
  </text>
</svg>
